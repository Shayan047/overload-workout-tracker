name: overload

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-overload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overload}
      POSTGRES_DB: ${POSTGRES_DB:-overload}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    environment:
      # Dev-only fallback secret. Set JWT_SECRET in backend/.env for anything real.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-overload}:${POSTGRES_PASSWORD:-overload}@db:5432/${POSTGRES_DB:-overload}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
