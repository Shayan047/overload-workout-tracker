<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rest's over</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060708}
.app{position:relative;width:390px;overflow:hidden;box-sizing:border-box;font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.4;color:#F3F5F7;background:#0B0C0E;-webkit-font-smoothing:antialiased}
.app *{box-sizing:border-box}
.num{font-stretch:68%;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.muted{color:#A8AFB8}
.faint{color:#88909A}
.small{font-size:13px}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border:0;border-radius:14px;background:#FFA41B;color:#1C1102;font-family:inherit;font-size:17px;font-weight:650;cursor:pointer}
.btn2{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border:1px solid #3E434A;border-radius:14px;background:transparent;color:#F3F5F7;font-family:inherit;font-size:15px;font-weight:650;cursor:pointer}
/* The whole rest, done: a full track. */
.track{height:6px;border-radius:4px;background:#FFA41B}
</style>
</helmet>
<main class="app" style="height:844px;padding:56px 24px 36px;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px">
      <svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true"><rect x="2" y="9" width="4.5" height="10" rx="1.5" fill="#5FA8BC"></rect><rect x="8.5" y="4" width="4.5" height="20" rx="1.5" fill="#FFA41B"></rect><rect x="15" y="4" width="4.5" height="20" rx="1.5" fill="#FFA41B"></rect><rect x="21.5" y="9" width="4.5" height="10" rx="1.5" fill="#5FA8BC"></rect></svg>
      <span style="font-size:20px;font-weight:750;font-stretch:80%;letter-spacing:0.01em">Overload</span>
    </div>
    <span class="muted" style="font-weight:600">6:58 PM</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
    <div class="small muted" style="font-weight:600;display:flex;align-items:center;gap:6px">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><circle cx="12" cy="13" r="7.5"></circle><path d="M12 9.5V13l2 1.5M10 3h4"></path></svg>
      Rested 1:30
    </div>
    <h1 style="margin:10px 0 0;font-size:56px;line-height:1;font-weight:700;font-stretch:85%;letter-spacing:-0.015em">Rest's over</h1>
    <div class="track" style="margin-top:22px"></div>

    <p style="margin:34px 0 0;font-size:24px;line-height:1.15;font-weight:700;font-stretch:85%">Bicep curl</p>
    <p class="muted" style="margin:6px 0 0">Set 3 of 4 next</p>
    <div style="margin-top:18px;display:flex;align-items:baseline;gap:10px;padding:14px 16px;border-radius:14px;background:#08090B">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;color:#7FD3EA;align-self:center"><path d="M6 20V11a6 6 0 0 1 12 0v9l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5z"></path><path d="M10 11h.01M14 11h.01"></path></svg>
      <span class="small" style="color:#7FD3EA;font-weight:600">Last time</span>
      <span class="num" style="font-size:24px;color:#7FD3EA">20 × 5</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px">
    <button class="btn">Start set 3</button>
    <button class="btn2">+15 sec</button>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
