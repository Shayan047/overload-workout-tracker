<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rest timer on lock screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060708}
.app{position:relative;width:390px;overflow:hidden;box-sizing:border-box;font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.4;color:#F3F5F7;background:#08090B;-webkit-font-smoothing:antialiased}
.app *{box-sizing:border-box}
.num{font-stretch:68%;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.h2{margin:0;font-size:17px;line-height:1.25;font-weight:650;font-stretch:92%}
.muted{color:#A8AFB8}
.faint{color:#88909A}
.small{font-size:13px}
.lb{height:44px;border:0;border-radius:12px;background:#22252A;color:#F3F5F7;font-family:inherit;font-size:15px;font-weight:650;cursor:pointer}
.lb:hover{background:#2B2F35}
</style>
</helmet>
<main class="app" style="height:844px;padding:110px 16px 0;display:flex;flex-direction:column">
  <div style="text-align:center">
    <div class="muted" style="font-size:17px;font-weight:600">Friday, October 9</div>
    <div style="font-size:96px;line-height:1;font-weight:300;font-stretch:75%;font-variant-numeric:tabular-nums;margin-top:6px">6:58</div>
  </div>

  <div style="flex:1"></div>

  <section aria-label="Rest timer" style="padding:16px;border-radius:24px;background:#16181B">
    <div class="faint small" style="display:flex;align-items:center;gap:8px">
      <svg viewBox="0 0 28 28" width="18" height="18" aria-hidden="true"><rect x="2" y="9" width="4.5" height="10" rx="1.5" fill="#5FA8BC"></rect><rect x="8.5" y="4" width="4.5" height="20" rx="1.5" fill="#FFA41B"></rect><rect x="15" y="4" width="4.5" height="20" rx="1.5" fill="#FFA41B"></rect><rect x="21.5" y="9" width="4.5" height="10" rx="1.5" fill="#5FA8BC"></rect></svg>
      <span style="font-weight:600">Overload</span>
      <span style="margin-left:auto">Resting</span>
    </div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:12px">
      <div style="min-width:0">
        <div class="h2" style="font-size:20px;font-stretch:85%">Bicep curl</div>
        <div class="small" style="color:#7FD3EA;margin-top:2px">Set 3 next. Last time 20 × 5</div>
      </div>
      <span class="num" role="timer" style="font-size:56px;color:#FFA41B">0:47</span>
    </div>
    <div style="position:relative;height:6px;margin-top:14px;border-radius:4px;background:#25282D;overflow:hidden">
      <span style="position:absolute;left:0;top:0;bottom:0;width:52%;border-radius:4px;background:#FFA41B"></span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px">
      <button class="lb">+15 sec</button>
      <button class="lb">Skip rest</button>
    </div>
  </section>

  <div style="height:150px"></div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
